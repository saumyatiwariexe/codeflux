version: "3.9"

services:
  # PostgreSQL (for local dev — Supabase handles production)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus_pulse
      POSTGRES_PASSWORD: dev_password_local
      POSTGRES_DB: campus_pulse_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/api/supabase/migrations:/docker-entrypoint-initdb.d

  # Redis (for local dev — Upstash handles production)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass dev_redis_password

  # Fastify API (for local dev)
  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://campus_pulse:dev_password_local@postgres:5432/campus_pulse_dev
      REDIS_URL: redis://:dev_redis_password@redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./packages/api/src:/app/src

volumes:
  postgres_data:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-quest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43E97B" />
      <stop offset="100%" stop-color="#38F9D7" />
    </linearGradient>

    <linearGradient id="glass-quest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    
    <filter id="glow-quest" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="20" fill="none" stroke="url(#bg-grad-quest)" stroke-width="3" filter="url(#glow-quest)" />
  <rect x="8" y="8" width="84" height="84" rx="16" fill="#0B0C14" />
  <rect x="12" y="12" width="76" height="76" rx="12" fill="url(#glass-quest)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Map / Location Pin Icon -->
  <path d="M50 25 C38 25 30 33 30 43 C30 58 50 75 50 75 C50 75 70 58 70 43 C70 33 62 25 50 25 Z" 
        fill="url(#bg-grad-quest)" />
  <circle cx="50" cy="42" r="7" fill="#0B0C14" />
  
  <!-- Dashed Map Route -->
  <path d="M25 60 C30 75 40 85 50 75" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#43E97B" />
    </linearGradient>

    <!-- Glass Overlay -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring (Glow) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#bg-grad)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Base Plate -->
  <circle cx="50" cy="50" r="42" fill="#121324" />
  
  <!-- Inner Glass Panel -->
  <circle cx="50" cy="50" r="38" fill="url(#glass)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Star Icon (Pioneer) -->
  <path d="M50 25 L55.5 39.5 L71 40 L58.5 50.5 L62.5 66 L50 58 L37.5 66 L41.5 50.5 L29 40 L44.5 39.5 Z" 
        fill="url(#bg-grad)" 
        stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
</svg>

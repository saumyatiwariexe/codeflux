<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-social" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#FF8E53" />
    </linearGradient>

    <linearGradient id="glass-social" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow-social" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#bg-grad-social)" stroke-width="4" filter="url(#glow-social)" />
  <circle cx="50" cy="50" r="42" fill="#121324" />
  <circle cx="50" cy="50" r="38" fill="url(#glass-social)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Multiple People Icon -->
  <circle cx="40" cy="40" r="8" fill="none" stroke="url(#bg-grad-social)" stroke-width="3" />
  <path d="M25 65 Q40 50 55 65" fill="none" stroke="url(#bg-grad-social)" stroke-width="3" stroke-linecap="round" />
  
  <circle cx="65" cy="45" r="6" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />
  <path d="M50 70 Q65 60 80 70" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
</svg>
